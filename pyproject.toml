[project]
name = "federated_acn"
version = "0.1.0"
description = "Federated Learning for EV Fleets"
requires-python = "==3.13.9"
dependencies = [
    "flwr[simulation]>=1.27.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
    "xgboost>=3.2.0",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black<26.3.1",
    "ruff>=0.15.6",
]
